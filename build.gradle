plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"waldschatten" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			inherit client
			vmArg "-Dfabric.client.gametest"
			runDir "build/run-gametest"
		}
		// The same worldgen survey, but with Terralith and lithostitched dropped in beside
		// us. The empire server runs Terralith, and "does this biome exist there" is not a
		// question that can be answered by reasoning about which file overrides which.
		terralithSurvey {
			inherit client
			vmArg "-Dfabric.client.gametest"
			vmArg "-Dwaldschatten.survey.only=true"
			runDir "build/run-terralith"
		}
		headlessSurvey {
			inherit server
			vmArg "-Dwaldschatten.headless.survey=true"
			vmArg "-Dwaldschatten.survey.seed=${System.getenv('WALDSCHATTEN_SURVEY_SEED') ?: '0'}"
			runDir "build/run-headless-survey"
		}
		headlessTerralithSurvey {
			inherit server
			vmArg "-Dwaldschatten.headless.survey=true"
			vmArg "-Dwaldschatten.survey.seed=${System.getenv('WALDSCHATTEN_SURVEY_SEED') ?: '0'}"
			runDir "build/run-headless-terralith"
		}
	}
}

// Every run config below boots a throwaway world under build/, and build/ is disposable,
// so the EULA acceptance has to be re-stamped on every run. (rule 9)
//
// Dependency staging. Waldschatten hard-depends on vibranium, so no run can boot without
// it — that is exactly how 0.1.2 came to ship against 0.1.0-era screenshots: the battery
// stopped being possible when the dependency was added, and a battery that cannot start
// looks the same from the outside as one nobody bothered to run.
//
// enchanted-forest is staged for a different reason: it is not a dependency, it is the
// OTHER empire mod that rewrites MultiNoiseBiomeSource.parameters(). 0.1.2 was verified
// twelve times, alone, and was absent from every real world because the two claims
// collided and the loser was silently skipped. A survey that does not run beside the mod
// this one actually ships beside does not answer the question being asked, so every
// survey and the battery stage it and fail loudly if it is missing.
//
// Jars come from the server staging folder by default; WALDSCHATTEN_DEP_MODS overrides.
def stageDepMods = { File modsDir, List<String> wanted ->
	modsDir.mkdirs()
	modsDir.listFiles()?.each { f ->
		if (f.name.endsWith('.jar') && wanted.any { f.name.toLowerCase().startsWith(it.toLowerCase()) }) {
			f.delete()
		}
	}
	def source = System.getenv('WALDSCHATTEN_DEP_MODS')
			?: "${System.getProperty('user.home')}/Desktop/mc-server/server-mods-staging"
	def found = []
	wanted.each { prefix ->
		def jar = file(source).listFiles()?.find {
			it.name.toLowerCase().startsWith(prefix.toLowerCase()) && it.name.endsWith('.jar')
		}
		if (!jar) {
			throw new GradleException("Staging needs a ${prefix} jar in ${source} (found none); "
					+ "set WALDSCHATTEN_DEP_MODS to a folder that has every one of ${wanted}")
		}
		new File(modsDir, jar.name).bytes = jar.bytes
		found << jar.name
	}
	logger.lifecycle("staged into ${modsDir}: ${found}")
}
def SHIPPED_BESIDE = ['vibranium', 'enchanted-forest']
def TERRAIN_STACK = ['Terralith', 'lithostitched', 'empire_worldgen']

tasks.matching { it.name == 'runGametest' }.configureEach {
	doFirst {
		def runDir = file('build/run-gametest')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text =
				"# written by the gametest run config; build/run-gametest is disposable\n" +
				"eula=true\n"
		stageDepMods(new File(runDir, 'mods'), SHIPPED_BESIDE)
	}
}

tasks.matching { it.name in ['runHeadlessSurvey', 'runHeadlessTerralithSurvey'] }.configureEach {
	doFirst {
		def runDir = it.name == 'runHeadlessSurvey'
				? file('build/run-headless-survey')
				: file('build/run-headless-terralith')
		delete new File(runDir, 'world')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text = "# throwaway headless release survey\neula=true\n"
		// server-port=0: nobody connects to a survey server, and binding 25565 collides with
		// whatever else is running on this machine — measured 2026-08-22, when a warfront dev
		// server owned the port and the survey died at bind with exit code 0 and no PASS line.
		new File(runDir, 'server.properties').text =
				"online-mode=false\n" +
				"server-port=0\n" +
				"generate-structures=true\n" +
				"max-tick-time=-1\n" +
				"level-seed=${System.getenv('WALDSCHATTEN_SURVEY_SEED') ?: '0'}\n" +
				"level-name=world\n"
		stageDepMods(new File(runDir, 'mods'),
				it.name == 'runHeadlessSurvey' ? SHIPPED_BESIDE : SHIPPED_BESIDE + TERRAIN_STACK)
	}
}

// The same worldgen survey, but with Terralith and lithostitched dropped in beside us. They
// are not a build dependency and are never shipped — this only exists so the Terralith
// question can be answered by measurement.
tasks.matching { it.name == 'runTerralithSurvey' }.configureEach {
	doFirst {
		def runDir = file('build/run-terralith')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text = "# throwaway survey world\neula=true\n"
		stageDepMods(new File(runDir, 'mods'), SHIPPED_BESIDE + TERRAIN_STACK)
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
