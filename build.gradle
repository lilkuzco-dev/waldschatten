plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"waldschatten" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			inherit client
			vmArg "-Dfabric.client.gametest"
			runDir "build/run-gametest"
		}
		// The same worldgen survey, but with Terralith and lithostitched dropped in beside
		// us. The empire server runs Terralith, and "does this biome exist there" is not a
		// question that can be answered by reasoning about which file overrides which.
		terralithSurvey {
			inherit client
			vmArg "-Dfabric.client.gametest"
			vmArg "-Dwaldschatten.survey.only=true"
			runDir "build/run-terralith"
		}
		headlessSurvey {
			inherit server
			vmArg "-Dwaldschatten.headless.survey=true"
			vmArg "-Dwaldschatten.survey.seed=${System.getenv('WALDSCHATTEN_SURVEY_SEED') ?: '0'}"
			runDir "build/run-headless-survey"
		}
		headlessTerralithSurvey {
			inherit server
			vmArg "-Dwaldschatten.headless.survey=true"
			vmArg "-Dwaldschatten.survey.seed=${System.getenv('WALDSCHATTEN_SURVEY_SEED') ?: '0'}"
			runDir "build/run-headless-terralith"
		}
	}
}

// The render battery boots a throwaway world under build/run-gametest, and build/ is
// disposable, so the EULA acceptance has to be re-stamped on every run. (rule 9)
tasks.matching { it.name == 'runGametest' }.configureEach {
	doFirst {
		def runDir = file('build/run-gametest')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text =
				"# written by the gametest run config; build/run-gametest is disposable\n" +
				"eula=true\n"
	}
}

tasks.matching { it.name in ['runHeadlessSurvey', 'runHeadlessTerralithSurvey'] }.configureEach {
	doFirst {
		def runDir = it.name == 'runHeadlessSurvey'
				? file('build/run-headless-survey')
				: file('build/run-headless-terralith')
		delete new File(runDir, 'world')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text = "# throwaway headless release survey\neula=true\n"
			new File(runDir, 'server.properties').text =
					"online-mode=false\n" +
					"generate-structures=true\n" +
					"max-tick-time=-1\n" +
					"level-seed=${System.getenv('WALDSCHATTEN_SURVEY_SEED') ?: '0'}\n" +
				"level-name=world\n"
	}
}

tasks.matching { it.name == 'runHeadlessTerralithSurvey' }.configureEach {
	doFirst {
		def modsDir = file('build/run-headless-terralith/mods')
		modsDir.mkdirs()
		def source = System.getenv('WALDSCHATTEN_TERRALITH_MODS')
		if (!source) {
			throw new GradleException('runHeadlessTerralithSurvey requires WALDSCHATTEN_TERRALITH_MODS')
		}
		def wanted = ['Terralith', 'lithostitched', 'empire_worldgen']
		def found = []
		file(source).listFiles()?.each { f ->
			if (f.name.endsWith('.jar') && wanted.any { f.name.toLowerCase().startsWith(it.toLowerCase()) }) {
				new File(modsDir, f.name).bytes = f.bytes
				found << f.name
			}
		}
		if (found.size() < 3) {
			throw new GradleException("Headless Terralith survey found only ${found} in ${source}")
		}
	}
}

// Stages Terralith + lithostitched into the survey run's mods folder. They are not a build
// dependency and are never shipped — this only exists so the Terralith question can be
// answered by measurement. Point WALDSCHATTEN_TERRALITH_MODS at any folder holding them.
tasks.matching { it.name == 'runTerralithSurvey' }.configureEach {
	doFirst {
		def runDir = file('build/run-terralith')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text = "# throwaway survey world\neula=true\n"
		def modsDir = new File(runDir, 'mods')
		modsDir.mkdirs()
		def source = System.getenv('WALDSCHATTEN_TERRALITH_MODS')
				?: "${System.getProperty('user.home')}/Desktop/mc-server/server-mods-staging"
		def wanted = ['Terralith', 'lithostitched']
		def found = []
		file(source).listFiles()?.each { f ->
			if (f.name.endsWith('.jar') && wanted.any { f.name.toLowerCase().startsWith(it.toLowerCase()) }) {
				new File(modsDir, f.name).bytes = f.bytes
				found << f.name
			}
		}
		if (found.size() < 2) {
			throw new GradleException("Terralith survey needs Terralith and lithostitched jars in ${source} "
					+ "(found ${found}); set WALDSCHATTEN_TERRALITH_MODS to a folder that has them")
		}
		logger.lifecycle("Terralith survey: staged ${found}")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
