plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"waldschatten" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			inherit client
			vmArg "-Dfabric.client.gametest"
			runDir "build/run-gametest"
		}
	}
}

// The render battery boots a throwaway world under build/run-gametest, and build/ is
// disposable, so the EULA acceptance has to be re-stamped on every run. (rule 9)
tasks.matching { it.name == 'runGametest' }.configureEach {
	doFirst {
		def runDir = file('build/run-gametest')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text =
				"# written by the gametest run config; build/run-gametest is disposable\n" +
				"eula=true\n"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
